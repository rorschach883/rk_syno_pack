name: Build DS124 7.4.1 for OEC-T

on:
  workflow_dispatch:
    inputs:
      pat_url:
        description: 'Synology PAT Download URL'
        required: true
        default: 'https://global.synologydownload.com/download/DSM/release/7.4.1/90080/DSM_DS124_90080.pat'
      serial_number:
        description: 'Synology Serial Number'
        required: true
        default: '183AQEN339808'
      mac_address:
        description: 'Device MAC Address (12 Hex chars without colons)'
        required: true
        default: '9009D0593283'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Normalize Shell Script Line Endings
        run: |
          find . -type f -name "*.sh" -exec sed -i 's/\r$//' {} +

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            cpio xz-utils patch curl e2fsprogs device-tree-compiler \
            dosfstools mtools gdisk gzip vim-common \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libsodium-dev libmsgpack-dev

      - name: Build SynoXtract Tool
        run: |
          cd tools/SynoXtract
          g++ -std=c++17 -O3 main.cpp -lsodium -o synoxtract
          chmod +x synoxtract

      - name: Compile RK3566 Kernel
        run: |
          export SOC=rk3566
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export JOBS=$(nproc)
          ./build.sh kernel

      - name: Download & Patch DS124 PAT
        run: |
          export SOC=rk3566
          export MODEL=DS124
          export SYNO_MAX_DISKS=1
          export PAT_URL="${{ github.event.inputs.pat_url }}"
          ./build.sh pat

      - name: Pack OEC-T Raw eMMC Image
        run: |
          export SOC=rk3566
          export SYNO_SN="${{ github.event.inputs.serial_number }}"
          export SYNO_MAC1="${{ github.event.inputs.mac_address }}"
          ./build.sh updateimg

          # 灏嗗畨瑁呭簳鍖呬笌 Update 1 琛ヤ竵鍖呬竴璧锋墦鍖呰繘鍏?Artifacts
          cp build/DSM_DS124_90080.pat output/dsm/ || true
          curl -L --fail -o output/dsm/DSM_DS124_90080-Update1.pat \
            "https://global.synologydownload.com/download/DSM/criticalupdate/update_pack/90080-1/synology_rtd1619b_ds124.pat" || true

      - name: Upload Output Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OECT-DS124-7.4.1-90080-Full-Package
          path: |
            output/dsm/rk3566-dsm-raw_*.img.gz
            output/dsm/rk3566-dsm-raw_*.img
            output/dsm/DSM_DS124_*.pat